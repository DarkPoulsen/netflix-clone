<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Página no encontrada | Netflix</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --text: #fff;
            --red: #e50914;
            --muted: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* FONDO ANIMADO CON ESTRELLAS */
        .space-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .stars {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        .star-twinkle {
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* CONTAINER */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        /* ASTRONAUTA */
        .astronaut-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            position: relative;
        }

        .astronaut {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotateZ(0deg);
            }
            25% {
                transform: translateY(-30px) rotateZ(5deg);
            }
            50% {
                transform: translateY(-50px) rotateZ(0deg);
            }
            75% {
                transform: translateY(-30px) rotateZ(-5deg);
            }
        }

        /* SVG ASTRONAUTA */
        .astronaut-svg {
            width: 150px;
            height: 150px;
            filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4));
        }

        /* ÓRBITA */
        .orbit {
            position: absolute;
            border: 2px dashed rgba(229, 9, 20, 0.2);
            border-radius: 50%;
            inset: 0;
            animation: spin 10s linear infinite;
        }

        .orbit:nth-child(1) {
            width: 280px;
            height: 280px;
            top: -40px;
            left: -40px;
        }

        .orbit:nth-child(2) {
            width: 350px;
            height: 350px;
            top: -75px;
            left: -75px;
            animation: spin 15s linear infinite reverse;
        }

        .orbit:nth-child(3) {
            width: 420px;
            height: 420px;
            top: -110px;
            left: -110px;
        }

        @keyframes spin {
            from { transform: rotateZ(0deg); }
            to { transform: rotateZ(360deg); }
        }

        /* CÓDIGO 404 */
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--red), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            line-height: 1;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.3));
            }
            50% {
                opacity: 0.7;
                filter: drop-shadow(0 0 40px rgba(229, 9, 20, 0.6));
            }
        }

        /* TEXTOS */
        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .error-subtitle {
            font-size: 1.1rem;
            color: var(--muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        /* BOTONES */
        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn {
            border: none;
            padding: 14px 28px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--red);
            color: var(--text);
        }

        .btn-primary:hover {
            background: #b20710;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        /* MENSAJE ADICIONAL */
        .easter-egg {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .easter-egg-text {
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .error-code {
                font-size: 5rem;
            }

            .error-title {
                font-size: 1.8rem;
            }

            .error-subtitle {
                font-size: 0.95rem;
            }

            .astronaut-container {
                width: 150px;
                height: 150px;
            }

            .astronaut-svg {
                width: 120px;
                height: 120px;
            }

            .btn {
                padding: 12px 22px;
                font-size: 0.9rem;
            }
        }

        /* LOGO NETFLIX */
        .netflix-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            color: var(--red);
            font-weight: 900;
            letter-spacing: -2px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="index.html" class="netflix-logo">NETFLIX</a>

    <!-- FONDO ESPACIAL -->
    <div class="space-bg" id="spaceBg"></div>

    <!-- CONTENIDO -->
    <div class="container">
        <!-- ÓRBITAS Y ASTRONAUTA -->
        <div class="astronaut-container">
            <div class="orbit"></div>
            <div class="orbit"></div>
            <div class="orbit"></div>
            
            <div class="astronaut">
                <svg class="astronaut-svg" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Cuerpo (traje espacial) -->
                    <ellipse cx="50" cy="60" rx="20" ry="28" fill="#e0e0e0"/>
                    
                    <!-- Brazos -->
                    <rect x="20" y="50" width="12" height="35" rx="6" fill="#d0d0d0"/>
                    <rect x="68" y="50" width="12" height="35" rx="6" fill="#d0d0d0"/>
                    
                    <!-- Manos -->
                    <circle cx="26" cy="88" r="6" fill="#f5a623"/>
                    <circle cx="74" cy="88" r="6" fill="#f5a623"/>
                    
                    <!-- Piernas -->
                    <rect x="40" y="88" width="10" height="22" rx="5" fill="#c0c0c0"/>
                    <rect x="50" y="88" width="10" height="22" rx="5" fill="#c0c0c0"/>
                    
                    <!-- Botas -->
                    <ellipse cx="45" cy="112" rx="6" ry="5" fill="#333"/>
                    <ellipse cx="55" cy="112" rx="6" ry="5" fill="#333"/>
                    
                    <!-- Cuello -->
                    <rect x="40" y="30" width="20" height="8" fill="#888"/>
                    
                    <!-- Casco -->
                    <circle cx="50" cy="18" r="16" fill="#87ceeb" opacity="0.3"/>
                    <circle cx="50" cy="18" r="16" fill="none" stroke="#87ceeb" stroke-width="1.5"/>
                    
                    <!-- Reflejo en el casco -->
                    <ellipse cx="44" cy="12" rx="4" ry="6" fill="#fff" opacity="0.6"/>
                    
                    <!-- Cara visible dentro del casco -->
                    <circle cx="50" cy="18" r="4" fill="#ffdbac"/>
                    <circle cx="47" cy="16" r="1.2" fill="#333"/>
                    <circle cx="53" cy="16" r="1.2" fill="#333"/>
                    <path d="M 50 20 Q 48 21 50 22 Q 52 21 50 20" fill="#333"/>
                    
                    <!-- Traje con detalles -->
                    <rect x="45" y="48" width="10" height="35" fill="#e50914" opacity="0.2"/>
                </svg>
            </div>
        </div>

        <!-- ERROR 404 -->
        <div class="error-code">404</div>

        <!-- TÍTULO -->
        <h1 class="error-title">Perdido en el espacio</h1>

        <!-- SUBTÍTULO -->
        <p class="error-subtitle">
            Parece que has flotado demasiado lejos. La página que buscas no existe en este universo.
        </p>

        <!-- BOTONES -->
        <div class="button-group">
            <a href="index.html" class="btn btn-primary">🏠 Volver al inicio</a>
            <a href="catalogo.html" class="btn btn-secondary">🎬 Ver películas</a>
        </div>

        <!-- EASTER EGG -->
        <div class="easter-egg">
            <span class="easter-egg-text">🛰️ Houston, tenemos un problema... de página 404</span>
        </div>
    </div>

    <script>
        // GENERAR ESTRELLAS ALEATORIAS
        function createStars() {
            const spaceBg = document.getElementById('spaceBg');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'stars star-twinkle';
                
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = Math.random() * 2 + 1;
                const duration = Math.random() * 3 + 2;

                star.style.left = x + '%';
                star.style.top = y + '%';
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDuration = duration + 's';
                star.style.animationDelay = Math.random() * 2 + 's';

                spaceBg.appendChild(star);
            }
        }

        // INICIALIZAR
        createStars();

        // EASTER EGG: Hacer clic 5 veces en el astronauta para sorpresa
        let clickCount = 0;
        const astronautContainer = document.querySelector('.astronaut-container');

        astronautContainer.addEventListener('click', () => {
            clickCount++;
            
            if (clickCount === 5) {
                alert('🚀 ¡Felicidades! Has desbloqueado el modo astronauta. Recarga la página para volver a la normalidad.');
                clickCount = 0;
            }
        });
    </script>
</body>
</html>
